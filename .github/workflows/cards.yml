name: Refresh README cards

on:
  schedule:
    - cron: "17 5 * * *"   # every morning, 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "config.json"
      - "scripts/**"
      - "fonts/**"
      - ".github/workflows/cards.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch contribution and repo data
        env:
          # Add a personal access token as the PROFILE_TOKEN secret if you
          # want private contributions counted; otherwise the default works.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: python scripts/fetch_data.py

      - name: Render README cards (hero, tiles, activity, repos, graph)
        run: python scripts/render_cards.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cards README.md
          git diff --cached --quiet || git commit -m "Refresh README cards"
          git push
